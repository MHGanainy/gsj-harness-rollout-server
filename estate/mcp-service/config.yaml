# gsj-mcp-service config — the service's owned surface (ADR-0040(b)).
# This file carries the STAGING deployment values (H200); every field is
# documented in README.md#configuration-reference. Validated at startup —
# unknown keys and type errors are startup failures with named fields.

source:
  # Staging Forgejo (static container IP — see estate/forgejo/): since CP-33 the
  # service ingests the PIPELINE-scaffolded estate under the gsj-staging
  # owner (estate/corpus/staging + estate/corpus/ingest_corpus.py, ADR-0047; the
  # corpus freeze record is estate/corpus/staging/corpus.lock.json). The CP-29 gsj-admin
  # repos remain live and byte-identical (the predecessor's
  # staging/dataset.frozen.json) but are no longer this service's source.
  # Anonymous read; auth_token_env names an env var only if the deployment
  # ever needs an authenticated pull.
  base_url: http://172.28.9.10:3000
  owner: gsj-staging
  repos: [case_0001, case_0002, case_0003, case_0004]
  ref_main: main
  ref_pattern: "timestep-{T}"
  auth_token_env: null
  clone_cache_dir: ./data/clones

embedding:
  # The encoder is configuration (CP-57): any sentence-transformers-loadable
  # HuggingFace model id, pinned by its full commit SHA (a branch or tag is
  # refused — it can move under the index). The store records which model
  # built it (fingerprint.json: embedding {model, revision, dimension}, and
  # every collection's metadata; a store from before CP-57 is assumed the
  # MiniLM pin below) and a change here REFUSES to serve until an explicit
  # re-embed — start once with index.rebuild: always (ADR-0016, CP-57). The default
  # MiniLM is the model every oracle bound was measured against; a
  # production re-pin owes its own measurement (A-31).
  model: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41   # HF pin, 2026-08-07
  device: cpu
  batch_size: 32
  normalize: true

chunking:
  max_tokens: 220        # must fit embedding.model's window minus its specials,
                         # with headroom: a chunk re-tokenizes a few tokens longer
                         # than its window — checked at startup and on the real
                         # chunks after ingest (CP-57); 220 leaves 34 under 256
  overlap: 40
  respect_page_boundaries: true   # contract — false is not a supported mode

index:
  path: ./data/index     # sidecars + the Chroma store under ./data/index/chroma
  rebuild: if-stale      # rebuild only on corpus-fingerprint mismatch
                         # (the fingerprint includes the Chroma version, CP-15)

search:
  default_k: 5
  max_k: 20
  method: chroma         # ChromaDB/HNSW, cutoff pre-filtered (ADR-0016);
                         # 'exact' is retired and rejected by name

decisions:
  seed: 20260204         # the deterministic corpus carried over (ADR-0007)
  corpus_size: 30

auth:
  token_secret_env: GSJ_MCP_TOKEN_SECRET   # env var NAME; value never in config
  leeway_s: 30                             # clock-skew allowance on exp

server:
  host: 0.0.0.0    # H200: containers reach host services via host.docker.internal
                   # only when bound beyond loopback (measured — the
                   # predecessor's staging/README)
  port: 8790
  log_level: info
  request_log_fields: [episode_id, case_id, timestep, tool, k, n_results,
                       latency_ms, cache_hit]
