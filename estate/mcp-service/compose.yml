# gsj-mcp-service — staging deployment (H200).
#
# H200 topology (measured at CP-29 — the predecessor's staging/README.md):
#   - published ports DO NOT WORK (docker-proxy's root-originated forward leg
#     is dropped by the uid-scoped firewall) => network_mode: host, binding
#     0.0.0.0:8790 directly;
#   - the service process must run as uid 1000 (sysadmin) so its own egress
#     (git clone from the staging Forgejo container IP) is firewall-allowed —
#     root egress is blocked;
#   - episode containers reach it at http://host.docker.internal:8790
#     (--add-host host-gateway, the pinned ADR-0034(d) channel).
#
# Secrets: GSJ_MCP_TOKEN_SECRET and GSJ_FORGEJO_READ_TOKEN_GSJ_STAGING (CP-58:
# the read credential config.yaml's source.auth_token_env names — the estate
# requires sign-in for read) must be present in the invoking environment;
# compose passes the NAMES through, the values never land in a file.
name: gsj-mcp-service
services:
  mcp:
    image: gsj-mcp-service:0.5.1   # 0.5.1 preserves 0.5.0; CP-79: the decisions surface (a rii drop
                                   # by decisions.path, level 2; the wrapper; one
                                   # fingerprint per collection; 0.4.1 = CP-77:
                                   # batched adds under chroma's 5,461-item ceiling +
                                   # the orphan sweep; 0.4.0 = CP-58: CP-57's
                                   # configurable encoder + the store identity,
                                   # config.yaml with the read credential baked;
                                   # 0.3.0 = CP-15, ChromaDB)
    container_name: gsj-mcp-service
    network_mode: host
    user: "1000:1000"
    environment:
      GSJ_MCP_TOKEN_SECRET: ${GSJ_MCP_TOKEN_SECRET:?set GSJ_MCP_TOKEN_SECRET in the environment}
      GSJ_FORGEJO_READ_TOKEN_GSJ_STAGING: ${GSJ_FORGEJO_READ_TOKEN_GSJ_STAGING:?export the read token (cat estate/forgejo/.token-gsj-staging-read) — the index build clones with it}
    volumes:
      - ./data:/app/data          # clone cache + index survive restarts
    restart: unless-stopped
