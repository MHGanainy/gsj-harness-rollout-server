          PROOF_PY
          cat > "$PROOF_ROOT/prepare.py" <<'PROOF_PY'
          import hashlib,json,os,platform,subprocess,tomllib,urllib.request,zipfile
          from pathlib import Path
          P=Path(os.environ['PROOF_ROOT']);M=json.loads((P/'manifest.json').read_text());W=Path(os.environ['GITHUB_WORKSPACE'])
          def sha(data):return hashlib.sha256(data).hexdigest()
          def git(*args):return subprocess.check_output(['git',*args],cwd=W,text=True).strip()
          assert platform.system()=='Linux' and platform.machine()=='x86_64' and os.environ['RUNNER_ARCH']=='X64'
          assert git('rev-parse','HEAD')==M['source'] and git('rev-parse','HEAD^{tree}')==M['tree']
          assert not git('status','--porcelain')
          assert sha((P/'run_installed_boundary.py').read_bytes())==M['observer_sha256']
          (P/'host.json').write_text(json.dumps({'tested_source':M['source'],'tested_tree':M['tree'],'workflow_commit':os.environ['GITHUB_SHA'],'workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'machine':platform.machine(),'platform':platform.platform(),'runner_arch':os.environ['RUNNER_ARCH']},indent=2)+'\n')
          for row in [M['wheel'],*M['observer_wheels']]:
           dest=P/('public-wheel' if row is M['wheel'] else 'observer-wheels');dest.mkdir(exist_ok=True)
           with urllib.request.urlopen(row['url'],timeout=90) as r:data=r.read()
           assert len(data)==row['bytes'] and sha(data)==row['sha256'],row['filename']
           (dest/row['filename']).write_bytes(data)
          config=tomllib.loads((W/'pyproject.toml').read_text());mapping={p:str(p) for p in M['payloads'] if p.startswith('gsj_rollout/') and '/' not in p.removeprefix('gsj_rollout/')}
          mapping.update({dest:src for src,dest in config['tool']['hatch']['build']['targets']['wheel']['force-include'].items()})
          assert set(mapping)==set(M['payloads']) and len(mapping)==13
          with zipfile.ZipFile(P/'public-wheel'/M['wheel']['filename']) as z:
           for dest,src in mapping.items():assert sha(z.read(dest))==sha((W/src).read_bytes())==M['payloads'][dest],dest
          (P/'payload-source-wheel.json').write_text(json.dumps({'source':M['source'],'wheel_sha256':M['wheel']['sha256'],'count':len(mapping),'mapping':mapping,'sha256':M['payloads']},indent=2)+'\n')
          # The only registry credential is an anonymous pull token held in memory.
          class PublicRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            next_req=super().redirect_request(req,fp,code,msg,headers,newurl)
            if next_req is not None:next_req.remove_header('Authorization')
            return next_req
          opener=urllib.request.build_opener(PublicRedirect())
          with opener.open('https://ghcr.io/token?service=ghcr.io&scope=repository:mhganainy/gsj-polar:pull',timeout=60) as r:token=json.load(r)['token']
          def fetch(kind,digest):
           req=urllib.request.Request('https://ghcr.io/v2/mhganainy/gsj-polar/'+kind+'/'+digest,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'})
           with opener.open(req,timeout=90) as r:data=r.read()
           assert 'sha256:'+sha(data)==digest
           return data
          for name,kind in [('index','manifests'),('manifest','manifests'),('config','blobs')]:
           data=fetch(kind,M[name]);(P/('registry-'+name+'.json')).write_bytes(data)
          index=json.loads((P/'registry-index.json').read_text());child=json.loads((P/'registry-manifest.json').read_text());cfg=json.loads((P/'registry-config.json').read_text())
          assert any(row['digest']==M['manifest'] and row['platform']['os']=='linux' and row['platform']['architecture']=='amd64' for row in index['manifests'])
          assert child['config']['digest']==M['config'] and cfg['os']=='linux' and cfg['architecture']=='amd64'
          print('Native x64 host, exact source tree, public wheel and 13 payloads, anonymous index/manifest/config chain verified.')
          PROOF_PY
          cat > "$PROOF_ROOT/inside.py" <<'PROOF_PY'
          import hashlib,importlib.metadata,json,platform,runpy,subprocess,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          import gsj_rollout
          from gsj_rollout import checks,estate
          P=Path('/proof-output');M=json.loads(Path('/observer/manifest.json').read_text());package=Path(gsj_rollout.__file__).resolve().parent
          assert platform.machine()=='x86_64' and platform.system()=='Linux'
          assert gsj_rollout.__version__=='0.1.18' and not estate.CHECKOUT
          assert 'site-packages' in package.parts and package.is_relative_to(Path(sys.prefix))
          assert Path('/opt/gsj/library-repo.sha').read_text().strip()==M['source']
          assert Path(checks.PINS_PATH)==Path(checks.PACKAGED_PINS)
          actual={name:hashlib.sha256((package.parent/name).read_bytes()).hexdigest() for name in M['payloads']};assert actual==M['payloads'] and len(actual)==13
          runtime=sorted([[d.metadata['Name'],d.version] for d in importlib.metadata.distributions()]);assert runtime==sorted(M['expected_runtime_distributions'])
          (P/'image-runtime.json').write_text(json.dumps({'version':gsj_rollout.__version__,'source':M['source'],'machine':platform.machine(),'platform':platform.platform(),'python':sys.version,'python_executable':sys.executable,'package':str(package),'payload_count':len(actual),'payload_sha256':actual,'distributions_before_observer':runtime},indent=2)+'\n')
          argv=[sys.executable,'-m','pip','install','--no-deps','--no-index',*map(str,sorted(Path('/observer-wheels').glob('*.whl')))];p=subprocess.run(argv,text=True,capture_output=True,timeout=120)
          (P/'observer-install.stdout').write_text(p.stdout);(P/'observer-install.stderr').write_text(p.stderr);assert p.returncode==0
          # Keep the reviewed observer byte-for-byte; this outer wrapper saves failures.
          out=P/'installed/native/amd64';sys.argv=['/observer/run_installed_boundary.py','/proof-source',str(out),'0.1.18']
          try:runpy.run_path(sys.argv[0],run_name='__main__')
