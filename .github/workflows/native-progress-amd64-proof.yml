          assert Path(estate.__file__).read_bytes()==(SOURCE/'estate/estate.py').read_bytes()
          assert Path(ingest_corpus.__file__).read_bytes()==(SOURCE/'estate/corpus/ingest_corpus.py').read_bytes()
          for name in ('conftest.py','cli_shapes.json','test_estate_native_pull_lifecycle.py','test_estate_native_pull_callers.py'):
           original=(SOURCE/'estate/corpus/tests'/name).read_text();adapted=original
           if name=='test_estate_native_pull_callers.py':
            old='''    sys.path.insert(0, str(source))
              import gsj_rollout
              assert Path(gsj_rollout.__file__).resolve() == source / "gsj_rollout/__init__.py"
              spec = importlib.util.spec_from_file_location("native_pull_subject", source / "estate/estate.py")'''
            new='''    import gsj_rollout
              from gsj_rollout import estate as installed_estate
              package=Path(gsj_rollout.__file__).resolve().parent
              assert 'site-packages' in package.parts and package.is_relative_to(Path(sys.prefix))
              spec = importlib.util.spec_from_file_location("native_pull_subject", installed_estate.__file__)'''
            assert adapted.count(old)==1;adapted=adapted.replace(old,new)
            adapted=adapted.replace('assert Path(est.__file__).resolve() == source / "estate/estate.py"','assert Path(est.__file__).resolve() == package / "estate.py" and not est.CHECKOUT')
            adapted=adapted.replace('assert Path(est.ic.__file__).resolve() == source / "estate/corpus/ingest_corpus.py"','assert Path(est.ic.__file__).resolve() == package / "ingest_corpus.py"')
           (OUT/name).write_text(adapted)
           (OUT/(name+'.adaptation.diff')).write_text(''.join(difflib.unified_diff(original.splitlines(True),adapted.splitlines(True),fromfile=str(SOURCE/'estate/corpus/tests'/name),tofile=str(OUT/name))))
          env={k:v for k,v in os.environ.items() if not k.startswith(('GSJ_','PIP_')) and k not in ('PYTHONPATH','PYTHONHOME')}
