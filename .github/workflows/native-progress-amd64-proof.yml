          cat > "$PROOF_ROOT/run_installed_boundary.py" <<'PROOF_PY'
          """Run reviewed controlled-process/caller tests against this installed artifact."""
          import difflib,hashlib,json,os,subprocess,sys
          from pathlib import Path
          from gsj_rollout import estate,ingest_corpus
          import gsj_rollout
          SOURCE=Path(sys.argv[1]).resolve();OUT=Path(sys.argv[2]).resolve();VERSION=sys.argv[3]
          assert not OUT.exists();OUT.mkdir(parents=True,mode=0o700)
