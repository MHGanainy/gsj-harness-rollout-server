# One-time release verification; this operational branch is never merged.
# Reuses the original installed observer, Docker and pytest. No product changes.
name: Native AMD64 published-image proof
on:
  push:
    branches: [ops/native-progress-amd64-20260912t105408z]
permissions:
  contents: read
