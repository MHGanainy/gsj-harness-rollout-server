          import json,os,subprocess
          from pathlib import Path
          P=Path(os.environ['PROOF_ROOT']);P.mkdir(exist_ok=True);name=os.environ['PROOF_CONTAINER']
          p=subprocess.run(['docker','container','inspect',name],capture_output=True,text=True)
          if p.returncode==0:
           row=json.loads(p.stdout)[0];assert row['Config']['Labels'].get('gsj.native-proof')==name
           subprocess.run(['docker','rm','-f',name],check=True)
          remaining=subprocess.check_output(['docker','ps','-a','--filter','label=gsj.native-proof='+name,'--format','{{.Names}}'],text=True).splitlines();assert not remaining
          if (P/'output').is_dir():
           assert (P/'output').resolve()==P/'output'
           subprocess.run(['sudo','chown','-R',str(os.getuid())+':'+str(os.getgid()),str(P/'output')],check=True)
          (P/'cleanup.json').write_text(json.dumps({'owned_container':name,'owned_containers_remaining':remaining,'scope':'Only this run-specific labelled container; no daemon-global changes.'},indent=2)+'\n')
          PROOF_PY
      - name: Verify native host, public artifact, exact source and registry chain
        run: python "$PROOF_ROOT/prepare.py"
      - name: Run unchanged installed lifecycle and caller assertions
        run: python "$PROOF_ROOT/driver.py"
      - name: Clean only this proof's container
        if: always()
        run: |
          if test -f "$PROOF_ROOT/cleanup.py"; then
            python "$PROOF_ROOT/cleanup.py"
          fi
      - name: Preserve proof records and any failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-amd64-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROOF_ROOT }}/*.json
            ${{ env.PROOF_ROOT }}/*.py
            ${{ env.PROOF_ROOT }}/*.stdout
            ${{ env.PROOF_ROOT }}/*.stderr
            ${{ env.PROOF_ROOT }}/output/*.json
            ${{ env.PROOF_ROOT }}/output/*.stdout
            ${{ env.PROOF_ROOT }}/output/*.stderr
            ${{ env.PROOF_ROOT }}/output/installed/native/amd64/*.json
            ${{ env.PROOF_ROOT }}/output/installed/native/amd64/*.xml
            ${{ env.PROOF_ROOT }}/output/installed/native/amd64/*.stdout
            ${{ env.PROOF_ROOT }}/output/installed/native/amd64/*.stderr
            ${{ env.PROOF_ROOT }}/output/installed/native/amd64/*.diff
            ${{ env.PROOF_ROOT }}/output/installed/native/amd64/lifecycle-tmp/**/result.json
          if-no-files-found: error
          retention-days: 30
