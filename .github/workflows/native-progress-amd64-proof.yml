          record={'version':VERSION,'python':sys.executable,'source':str(SOURCE),'installed_estate':estate.__file__,'estate_sha256':hashlib.sha256(Path(estate.__file__).read_bytes()).hexdigest(),'ingest_sha256':hashlib.sha256(Path(ingest_corpus.__file__).read_bytes()).hexdigest(),'source_hashes':{n:hashlib.sha256((SOURCE/'estate/corpus/tests'/n).read_bytes()).hexdigest() for n in ('test_estate_native_pull_lifecycle.py','test_estate_native_pull_callers.py')},'groups':[],'limits':'Controlled subprocesses do not establish cancellation of Docker daemon pulls; caller health/readiness unrelated seams substituted as documented.'}
          for label,filename,selection in [('lifecycle','test_estate_native_pull_lifecycle.py',None),('callers','test_estate_native_pull_callers.py','not checkout_arm_default and not pull_cli_shapes_match_real_cli and not admin_program_shape')]:
           argv=[sys.executable,'-m','pytest','-q','-ra','-p','no:cacheprovider','--basetemp',str(OUT/(label+'-tmp')),'--junitxml',str(OUT/(label+'.xml')),str(OUT/filename)]
           if selection:argv+=['-k',selection]
           p=subprocess.run(argv,cwd=OUT,env=env,text=True,capture_output=True,timeout=180)
           (OUT/(label+'.stdout')).write_text(p.stdout);(OUT/(label+'.stderr')).write_text(p.stderr)
           row={'group':label,'argv':argv,'exit':p.returncode,'stdout':p.stdout,'stderr':p.stderr,'deliberately_deselected':('one checkout-only default test and three separately owned live fixture tests' if selection else None)}
           record['groups'].append(row);(OUT/'result.json').write_text(json.dumps(record,indent=2)+'\n')
