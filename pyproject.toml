[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsj-harness-rollout-server"
version = "0.1.10"
description = "Rollout server for the gsj corpus: task -> sandbox -> agent -> trace, built on NVIDIA Polar."
readme = "README.md"
# CP-19 (ADR-0020): Apache-2.0, the same licence the vendored Polar carries, so
# the one tree holds one set of terms. `vendor/polar/` keeps its OWN LICENSE file
# (Copyright 2026 NVIDIA) and is covered by that, not by ours — the distinction is
# kept structural rather than textual: vendor/ is in NEITHER built artifact, so
# nothing NVIDIA-authored ships under our name (asserted in CI, Step 3 of CP-19).
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.12 is the floor because 3.12 is what is TESTED (CI) and what this project
# DEPLOYS into (the mcp-service image, Polar's uv venv, the H200 collector). The
# claim was `>=3.11` and nothing ever ran 3.11 — CP-19 narrowed it rather than
# widening CI, per its own Step 2. The operator's 3.13 workstation venv is inside
# this range and runs the suite every CP.
requires-python = ">=3.12"
# Short and true, and each line has a basis. No `License ::` classifier: PEP 639
# forbids pairing one with the SPDX `license` expression above. No
# `Typing :: Typed`: that classifier asserts PEP 561, which needs a `py.typed`
# marker in the package — there is none, and adding one is a `gsj_rollout/` change
# this CP is not lifted for. 3.12 is CI's interpreter; 3.13 is the operator's
# workstation venv, which runs the root suite every checkpoint. 4 - Beta because
# the fixture half is CI-green and one training loop ran end to end (CP-17),
# against a 0.1.0 with no external consumer yet.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core deps are the trainer-side weight, nothing more (ADR-0001):
dependencies = [
    "pydantic",
    "httpx",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/MHGanainy/gsj-harness-rollout-server"
# The document a stranger should read FIRST: the adoption verdict, its reversing
# conditions, and the gap register's consolidated wishlist.
Verdict = "https://github.com/MHGanainy/gsj-harness-rollout-server/blob/main/docs/VERDICT.md"
Charter = "https://github.com/MHGanainy/gsj-harness-rollout-server/blob/main/docs/CHARTER.md"
"Checks specification" = "https://github.com/MHGanainy/gsj-harness-rollout-server/blob/main/docs/checks-spec.md"

[project.optional-dependencies]
# [server] stays deliberately empty, now as a decision rather than a
# placeholder (CP-03, ADR-0005): Polar runs from its own vendor/polar/.venv
# (uv, Python 3.12, upstream's install recipe), and at CP-06 the dependency
# points the other way — Polar's venv hosts gsj_rollout via import_path,
# which works because our core deps are a subset of Polar's five (A-14).
server = []
# pyarrow is here for the `--from-bank` tests (CP-33, wishlist 20): the CLI
# imports it lazily behind a named error and core stays pyarrow-free
# (ADR-0022 §5) — dev needs it so CI actually exercises the happy path.
dev = ["pytest", "pyarrow"]
# There is NO [verl] and NO [slime] extra, decided at CP-25 (ADR-0023):
# verl must install `--no-deps` from git at a pinned SHA (its declared
# closure drags GPU-stack deps a trainer host must not resolve, and pip
# extras cannot express --no-deps; PyPI additionally rejects direct git
# URLs in published metadata), and slime is a 24.4 GB container image, not
# a pip target at all. Each bridge's install is a requirements file plus
# one documented command in the examples repo — see
# gsj-harness-rollout-server-examples/example_project/.

[project.scripts]
gsj-rollout = "gsj_rollout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gsj_rollout"]

# CP-16 (ADR-0017): the trainer leg runs from an installed wheel, so the
# approved sets ride inside the package — `pins/` stays the single source,
# copied into the wheel at build time only (never duplicated in the tree).
# `checks.PINS_PATH` resolves GSJ_PINS_PATH → repo checkout → this copy.
[tool.hatch.build.targets.wheel.force-include]
"pins/pins.gsj.json" = "gsj_rollout/pins/pins.gsj.json"
# CP-33 (wishlist 28): the thinking-on set rides beside it, data only, so a
# pip-only thinking-on estate has a file to point GSJ_PINS_PATH at:
#   site-packages/gsj_rollout/pins/thinking-on/pins.gsj.json
# Selection stays explicit-env (ADR-0024) — default resolution still means
# the thinking-off reference (ADR-0019); nothing in checks.py changed.
"pins/thinking-on/pins.gsj.json" = "gsj_rollout/pins/thinking-on/pins.gsj.json"
# CP-34 (Step 3): the corpus pipeline rides the wheel, so a pip-install
# consumer can validate a corpus tree with NO repo clone:
#   python -m gsj_rollout.estate validate --corpus <root>
# (CP-72: the estate tool's folded verb; the pipeline's own entry,
# `python -m gsj_rollout.ingest_corpus validate`, still works and prints a
# deprecation notice — kept through 0.1.9 (CP-91); removal no earlier than 0.1.8.)
# The file is a moved component (charter §3 excludes corpus/ from the size
# law; estate/corpus/ since CP-50) and is fully standalone — stdlib + PyYAML unconditionally, pyarrow
# lazily behind a named error (taskbank/verify only). Its home stays
# with the pipeline (estate/corpus/ingest_corpus.py since CP-50): single source, copied at build time exactly like
# the pins files above; nothing in gsj_rollout/*.py changed to carry it.
"estate/corpus/ingest_corpus.py" = "gsj_rollout/ingest_corpus.py"
# CP-60 (wishlist 36): the G2 reference capture — the docker-mode /workspace
# SINGLETON whose sha256 IS `pins.system_prompt_hash` — rides beside the pins
# files, data only, so a bring-your-own estate derives its own G2 prompt from
# the installed wheel instead of a tripwired copy (the demo carried one from
# CP-34). Same subdirectory as in `pins/`:
#   site-packages/gsj_rollout/pins/container/system_prompt.container.derived.txt
"pins/container/system_prompt.container.derived.txt" = "gsj_rollout/pins/container/system_prompt.container.derived.txt"
# CP-60 (wishlist 48): the estate tool rides the wheel the same way, so a
# consumer can stand an estate up from a corpus with NO repo clone:
#   python -m gsj_rollout.estate up --corpus <root> [--answers <yaml>]
# (CP-72 renamed the tool: estate/bringup.py -> estate/estate.py, packaged
# gsj_rollout.bringup -> gsj_rollout.estate; wheels <= 0.1.5 carry the old
# name.) Its home stays estate/ (outside the size law — CHARTER §3 counts
# `wc -l gsj_rollout/*.py`, and a build-time copy adds no line to it; the
# same reading CP-34 gave ingest_corpus.py and ADR-0027 kept). Unlike the
# pipeline it was NOT standalone by construction: it found the pipeline and
# its runs directory relative to the checkout, so the file carries a two-way
# shim (checkout layout, else the wheel's — CP-60, measured on the artifact).
"estate/estate.py" = "gsj_rollout/estate.py"

# CP-19: the sdist root set is stated EXPLICITLY because the backend's default is
# "every tracked path", measured here at 4.6 MB / 835 files including
# `vendor/polar/` (215 entries of NVIDIA-authored Apache-2.0 source), `estate/`
# (its corpus/, mcp-service/, forgejo/ and serving/ sat at the root until CP-50),
# `spike/`, `docs/` and `tests/`. One
# `twine upload dist/*` would have published all of it under this project's name.
#
# It is `only-include`, not `include`, and that distinction is load-bearing:
# with `include` hatchling still applied its default file selection ON TOP, which
# globs README/LICENSE/pyproject RECURSIVELY — the sdist kept
# `vendor/polar/LICENSE`, `vendor/polar/pyproject.toml` and 20 vendored
# `README.md` files. Measured, not assumed (CP-19 Step 3). `only-include`
# narrows the root set instead of extending it, and the result is
# `gsj_rollout/` + the force-included files + the root README/LICENSE/pyproject.
# ADR-0027: the pipeline's path INSIDE the sdist moved at CP-50
# (`corpus/ingest_corpus.py` → `estate/corpus/ingest_corpus.py`); the wheel's
# entry (`gsj_rollout/ingest_corpus.py`) did not. 0.1.3 is the first release
# past that move, and publication is still wheel-only.
#
# `pins/pins.gsj.json` is listed because the force-include above reads it from
# the project ROOT — `python -m build` with no flags builds the wheel FROM the
# sdist, so dropping it here would silently produce a pins-less wheel: the exact
# CP-11b breakage CP-16 fixed. Publication is wheel-only regardless (ADR-0020);
# this stanza is the guard for the local build that produces both.
[tool.hatch.build.targets.sdist]
only-include = [
    "gsj_rollout",
    "pins/pins.gsj.json",
    "pins/thinking-on/pins.gsj.json",
    "estate/corpus/ingest_corpus.py",
    "pins/container/system_prompt.container.derived.txt",
    "estate/estate.py",
]

# Bare `pytest` runs the repo's own suite only; the moved components' suites
# are invoked explicitly (`cd corpus && python -m pytest`, same for
# mcp-service) — the predecessor's convention, kept at CP-01.
[tool.pytest.ini_options]
testpaths = ["tests"]
